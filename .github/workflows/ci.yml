name: CI

# The full quality gate. A push or pull request that changes only
# documentation (CLAUDE.md, "Verification Policy", V1's documentation class)
# is skipped: the gate's inputs are unchanged. Fail-safe: only known
# documentation files are excluded, by extension, so any other or unknown file
# runs the gate; any .dart file is re-included, because `flutter analyze` reads
# every .dart file in the package. The two
# path lists must stay identical.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**.md'
      - '!docs/**.patch'
      - '!CLAUDE.md'
      - '!README.md'
      - '!.agents/**.md'
      - '**.dart'
  pull_request:
    paths:
      - '**'
      - '!docs/**.md'
      - '!docs/**.patch'
      - '!CLAUDE.md'
      - '!README.md'
      - '!.agents/**.md'
      - '**.dart'

jobs:
  quality-gate:
    # Pinned (S12.1): ubuntu-latest moves to Ubuntu 26 from 2026-10-19; a new
    # image is adopted deliberately, with its own green run.
    runs-on: ubuntu-24.04
    steps:
      # v5 runs on Node 24; v4's Node 20 runtime is deprecated on the runners.
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - run: flutter pub get
      - run: dart run tool/check.dart
